name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mova-strategy-app-bqg8k0
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The Supabase connection baked into the build. The anon key is
          # public by design; Row Level Security protects the data.
          VITE_SUPABASE_URL: https://dpgdqroenesnbkunyvrd.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwZ2Rxcm9lbmVzbmJrdW55dnJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NjcxNzgsImV4cCI6MjEwMDA0MzE3OH0.cuhIzFCmVShfGrtOpoKFleHvSMATNoVF6uDm1Shzg8I
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
